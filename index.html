      if ((i === maxIdx && v > 0) || (isToday && v > 0)) {
        labels += `<text x="${x + bw / 2}" y="${y(v) - 5}" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--ink-2)" stroke="var(--surface)" stroke-width="3" paint-order="stroke">${fmt(v)}</text>`;
      }
      if (i % 7 === keys.length % 7 % 7 || i === keys.length - 1) { /* sparse x labels below */ }
    });

    let xlabels = '';
    const step = keys.length <= 7 ? 1 : 7;
    for (let i = keys.length - 1; i >= 0; i -= step) {
      const d = keyToDate(keys[i]);
      const x = PADL + i * (plotW / keys.length) + bw / 2;
      const lbl = keys.length <= 7
        ? d.toLocaleDateString(undefined, { weekday: 'short' })
        : (d.getMonth() + 1) + '/' + d.getDate();
      xlabels += `<text x="${x}" y="${VB_H - 8}" text-anchor="middle" font-size="10" fill="var(--muted)">${lbl}</text>`;
    }

    const grid = yTicks(maxV).map(t =>
      `<line x1="${PADL}" x2="${VB_W - PADR}" y1="${y(t.v)}" y2="${y(t.v)}" stroke="var(--grid)" stroke-width="1"></line>
       <text x="${PADL - 6}" y="${y(t.v) + 3.5}" text-anchor="end" font-size="10" fill="var(--muted)">${t.label}</text>`).join('');

    const distinctGoals = [...new Set(goals.filter(g => g != null && g > 0))];
    const goalLine = distinctGoals.length === 1
      ? `<text x="${VB_W - PADR}" y="${y(distinctGoals[0]) - 5}" text-anchor="end" font-size="10" font-weight="700" fill="var(--ink-2)" stroke="var(--surface)" stroke-width="3" paint-order="stroke">goal ${fmt(distinctGoals[0])}</text>`
      : '';

    return `<svg class="viz" viewBox="0 0 ${VB_W} ${VB_H}" role="img" aria-label="Daily ${esc(act.name)} totals, last ${keys.length} days">
      ${grid}${bars}${goalLine}${labels}${xlabels}
      <line x1="${PADL}" x2="${VB_W - PADR}" y1="${PADT + plotH}" y2="${PADT + plotH}" stroke="var(--hairline)" stroke-width="1"></line>
    </svg>`;
  }

  /* generic day-series line chart: o = {name, unit, goal, goalLabel, fmtV, emptyMsg} */
  function lineChart(keys, getVal, o) {
    const fv = o.fmtV || fmt;
    const pts = [];
    keys.forEach((k, i) => { const v = getVal(k); if (v != null) pts.push({ i, k, v }); });
    if (pts.length < 2) return `<div class="empty">${o.emptyMsg}</div>`;

    const vs = pts.map(p => p.v);
    let lo = Math.min(...vs), hi = Math.max(...vs);
    if (o.goal != null) { lo = Math.min(lo, o.goal); hi = Math.max(hi, o.goal); }
    const span = Math.max(1, hi - lo); lo -= span * 0.15; hi += span * 0.15;

    const plotW = VB_W - PADL - PADR, plotH = VB_H - PADT - PADB;
    const x = i => PADL + (keys.length === 1 ? plotW / 2 : (i / (keys.length - 1)) * plotW);
    const y = v => PADT + plotH - ((v - lo) / (hi - lo)) * plotH;

    const path = pts.map((p, j) => (j ? 'L' : 'M') + x(p.i).toFixed(1) + ',' + y(p.v).toFixed(1)).join(' ');
    const area = path + ` L${x(pts[pts.length - 1].i).toFixed(1)},${PADT + plotH} L${x(pts[0].i).toFixed(1)},${PADT + plotH} Z`;

    const dots = pts.map((p, j) => {
      const d = keyToDate(p.k);
      const tip = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + ': ' + fv(p.v) + ' ' + o.unit;
      const last = j === pts.length - 1;
      return `<circle cx="${x(p.i)}" cy="${y(p.v)}" r="${last ? 5 : 3.5}" fill="${last ? 'var(--accent)' : 'var(--surface)'}"
          stroke="var(--accent)" stroke-width="2" data-tip="${esc(tip)}"></circle>
        <rect x="${x(p.i) - 8}" y="${PADT}" width="16" height="${plotH}" fill="transparent" data-tip="${esc(tip)}"></rect>`;
    }).join('');

    const endLabel = `<text x="${Math.min(x(pts[pts.length-1].i) + 8, VB_W - 2)}" y="${y(pts[pts.length-1].v) + 4}" font-size="11" font-weight="700" fill="var(--ink-2)">${fv(pts[pts.length-1].v)}</text>`;

    const glines = [lo + (hi - lo) * 0.25, lo + (hi - lo) * 0.5, lo + (hi - lo) * 0.75].map(v =>
      `<line x1="${PADL}" x2="${VB_W - PADR}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"></line>
       <text x="${PADL - 6}" y="${y(v) + 3.5}" text-anchor="end" font-size="10" fill="var(--muted)">${fv(Math.round(v * 100) / 100)}</text>`).join('');

    const goalLine = o.goal != null
      ? `<line x1="${PADL}" x2="${VB_W - PADR}" y1="${y(o.goal)}" y2="${y(o.goal)}" stroke="var(--ink-2)" stroke-width="1.5" stroke-dasharray="5 4"></line>
         <text x="${VB_W - PADR}" y="${y(o.goal) - 5}" text-anchor="end" font-size="10" font-weight="700" fill="var(--ink-2)" stroke="var(--surface)" stroke-width="3" paint-order="stroke">${o.goalLabel || 'target'} ${fv(o.goal)}</text>`
      : '';

    let xlabels = '';
    for (let i = keys.length - 1; i >= 0; i -= Math.ceil(keys.length / 5)) {
      const d = keyToDate(keys[i]);
      xlabels += `<text x="${x(i)}" y="${VB_H - 8}" text-anchor="middle" font-size="10" fill="var(--muted)">${d.getMonth() + 1}/${d.getDate()}</text>`;
    }

    return `<svg class="viz" viewBox="0 0 ${VB_W} ${VB_H}" role="img" aria-label="${esc(o.name)} trend">
      ${glines}
      <path d="${area}" fill="var(--accent)" opacity="0.12"></path>
      <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path>
      ${goalLine}${dots}${endLabel}${xlabels}
      <line x1="${PADL}" x2="${VB_W - PADR}" y1="${PADT + plotH}" y2="${PADT + plotH}" stroke="var(--hairline)" stroke-width="1"></line>
    </svg>`;
  }

  function progressBlock(acts, showEntries = true) {
    let sel = acts.find(a => a.id === state.ui.progressAct) || acts[0];

    const chips = acts.length > 1
      ? `<div class="chips">` + acts.map(a =>
          `<button class="chip ${a.id === sel.id ? 'sel' : ''}" data-action="pick-act" data-act="${a.id}">${esc(a.name)}</button>`).join('') + `</div>`
      : '';

    const range = state.ui.range === 'week' ? 'week' : 'month';
    const days = range === 'week' ? 7 : 30;
    const rangeKeys = lastNDays(days);
    const today = dayValue(sel, todayKey());
    const isMeasure = sel.kind === 'measure';

    let tiles = '';
    if (isMeasure) {
      const all = state.entries.filter(e => e.actId === sel.id).sort((a,b) => a.ts - b.ts);
      const latest = all.length ? all[all.length - 1].amount : null;
      const keys7 = lastNDays(7).map(k => dayValue(sel, k)).filter(v => v != null);
      const wk = keys7.length ? keys7.reduce((a,b) => a+b, 0) / keys7.length : null;
      const first = all.length ? all[0].amount : null;
      const change = latest != null && first != null ? latest - first : null;
      tiles = `<div class="tiles">
        <div class="tile"><div class="tv">${fmt(latest)}</div><div class="tk">Latest</div><div class="tu">${esc(sel.unit)}</div></div>
        <div class="tile"><div class="tv">${fmt(wk != null ? Math.round(wk*10)/10 : null)}</div><div class="tk">7-day avg</div><div class="tu">${esc(sel.unit)}</div></div>
        <div class="tile"><div class="tv">${change != null ? (change > 0 ? '+' : '') + fmt(Math.round(change*10)/10) : '–'}</div><div class="tk">All-time change</div><div class="tu">${esc(sel.unit)}</div></div>
        <div class="tile"><div class="tv">${sel.goal != null ? fmt(sel.goal) : '–'}</div><div class="tk">Target</div><div class="tu">${esc(sel.unit)}</div></div>
      </div>`;
    } else if (sel.kind === 'distance') {
      const vals7 = lastNDays(7).map(k => dayValue(sel, k) || 0);
      const week = vals7.reduce((a,b) => a+b, 0);
      const timed = rangeKeys.flatMap(k => entriesFor(sel.id, k).filter(e => e.mins > 0));
      const tDist = timed.reduce((s,e) => s + e.amount, 0);
      const tMins = timed.reduce((s,e) => s + e.mins, 0);
      const avgPace = tDist > 0 && tMins > 0 ? paceStr(sel, tDist, tMins) : null;
      tiles = `<div class="tiles">
        <div class="tile"><div class="tv">${fmt(today || 0)}</div><div class="tk">Today</div><div class="tu">${esc(sel.unit)}</div></div>
        <div class="tile"><div class="tv">${fmt(week)}</div><div class="tk">Last 7 days</div><div class="tu">${esc(sel.unit)}</div></div>
        <div class="tile"><div class="tv">${avgPace || '–'}</div><div class="tk">Avg pace</div><div class="tu">${avgPace ? 'timed entries' : 'log time to see pace'}</div></div>
        <div class="tile"><div class="tv">${(sel.goal != null || sel.plan) ? streak(sel) : '–'}</div><div class="tk">Goal streak</div><div class="tu">${(sel.goal != null || sel.plan) ? 'days' : 'no goal set'}</div></div>
      </div>`;
    } else {
      const vals7 = lastNDays(7).map(k => dayValue(sel, k) || 0);
      const week = vals7.reduce((a,b) => a+b, 0);
      const best = Math.max(0, ...rangeKeys.map(k => dayValue(sel, k) || 0));
      tiles = `<div class="tiles">
        <div class="tile"><div class="tv">${fmt(today || 0)}</div><div class="tk">Today</div><div class="tu">${esc(sel.unit)}</div></div>
        <div class="tile"><div class="tv">${fmt(week)}</div><div class="tk">Last 7 days</div><div class="tu">${esc(sel.unit)}</div></div>
        <div class="tile"><div class="tv">${fmt(best)}</div><div class="tk">Best day</div><div class="tu">${esc(sel.unit)}</div></div>
        <div class="tile"><div class="tv">${(sel.goal != null || sel.plan) ? streak(sel) : '–'}</div><div class="tk">Goal streak</div><div class="tu">${(sel.goal != null || sel.plan) ? 'days' : 'no goal set'}</div></div>
      </div>`;
    }

    const chart = isMeasure
      ? lineChart(rangeKeys, k => dayValue(sel, k), {
          name: sel.name, unit: sel.unit, goal: sel.goal, goalLabel: 'target',
          emptyMsg: 'Record ' + esc(sel.name) + ' on a few days and the trend appears here.'
        })
      : barChart(sel, rangeKeys);
    const pu = sel.kind === 'distance' ? perUnit(sel) : null;
    const paceChart = sel.kind === 'distance'
      ? lineChart(rangeKeys, k => dayPace(sel, k), {
          name: sel.name + ' pace', unit: pu.lbl.slice(1), fmtV: mmss,
          emptyMsg: 'Add a time when you log ' + esc(sel.name.toLowerCase()) + ' (distance + minutes) and your pace trend appears here.'
        })
      : null;
    const seg = `<span class="seg" role="group" aria-label="Chart range">
      <button class="${range === 'week' ? 'sel' : ''}" data-action="set-range" data-range="week">Week</button>
      <button class="${range === 'month' ? 'sel' : ''}" data-action="set-range" data-range="month">Month</button>
    </span>`;

    return `
      ${chips}
      ${tiles}
      <section class="card">
        <div class="chart-title"><span class="ct">Performance</span>${seg}</div>
        <div class="chartwrap">${chart}</div>
      </section>
      ${paceChart ? `<section class="card">
        <div class="chart-title"><span class="ct">Pace</span><span class="cs">min${esc(pu.lbl)}</span></div>
        <div class="chartwrap">${paceChart}</div>
      </section>` : ''}
      ${showEntries ? entriesBlock(sel) : ''}
    `;
  }

  function entriesBlock(sel) {
    const dayk = state.ui.calSel || todayKey();
    const dayLabel = dayk === todayKey() ? 'Today' : keyToDate(dayk).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
    const recent = state.entries.filter(e => e.actId === sel.id && dayKey(e.ts) === dayk).sort((a,b) => b.ts - a.ts);
    const logRows = recent.map(e => {
      const when = timeShort(e.ts);
      const pace = sel.kind === 'distance' && e.mins > 0 ? ' · ' + mmss(e.mins) + ' min · ' + paceStr(sel, e.amount, e.mins) : '';
      const load = e.load ? ` · <span class="loadtag">+${e.load} lb</span>` : '';
      return `<tr><td class="amt">${fmt(e.amount)} ${esc(sel.unit)}${pace}${load}</td><td class="when">${when}</td>
        <td class="del"><button data-action="del-entry" data-id="${e.id}" aria-label="Delete entry">✕</button></td></tr>`;
    }).join('');

    return `
      <section class="card">
        <div class="chart-title"><span class="ct">Entries — ${esc(dayLabel)}</span></div>
        ${recent.length ? `<table class="log"><tbody>${logRows}</tbody></table>` : `<div class="empty">Nothing logged ${dayk === todayKey() ? 'today yet' : 'this day'}. ${dayk === todayKey() ? '' : 'Use the calendar to add entries.'}</div>`}
      </section>
    `;
  }

  /* ---------- MANAGE ---------- */
  function renderManage() {
    const kindLabel = { count: 'reps · daily total', distance: 'distance · daily total', duration: 'time · daily total', measure: 'measurement · latest value' };
    const planName = { armstrong: 'Armstrong program', volume: 'grease-the-groove + Sat test', plank: 'accumulated holds + Sat test', run: 'base + intervals + tempo', swim: 'CSS intervals + time trial' };
    const rows = sortedActs().map(a => `
      <section class="card" data-actrow="${a.id}">
        <div class="gc-head"><span class="mname">${esc(a.name)}<span class="mkind">${kindLabel[a.kind] || a.kind}${a.plan ? ' · plan: ' + planName[a.plan.id] : ''}</span></span></div>
        <div class="mgrid" style="margin-top:10px">
          <div class="field"><label>Name</label><input data-f="name" value="${esc(a.name)}"></div>
          <div class="field"><label>Unit</label><input data-f="unit" value="${esc(a.unit)}"></div>
          <div class="field"><label>${a.kind === 'measure' ? 'Target' : (a.plan ? 'Daily goal (blank = plan decides)' : 'Daily goal (blank = none)')}</label>
            <input data-f="goal" type="number" inputmode="decimal" step="any" min="0" value="${a.goal != null ? a.goal : ''}" placeholder="${a.plan ? 'auto from plan' : 'none'}"></div>
          <div class="field"><label>Quick buttons (comma-sep)</label><input data-f="quick" value="${esc((a.quick || []).join(', '))}"></div>
          <div class="field"><label>Section</label>
            <select data-f="group">${GROUPS.map(g => `<option value="${g}" ${a.group === g ? 'selected' : ''}>${GROUP_LABEL[g]}</option>`).join('')}</select></div>
          ${a.plan && a.plan.id === 'armstrong' ? `<div class="field"><label>Armstrong working set (reps)</label>
            <input data-f="ws" type="number" inputmode="numeric" min="1" step="1" value="${a.plan.ws || 5}"></div>` : ''}
        </div>
        <div class="mactions">
          <button class="btn primary" data-action="save-act" data-act="${a.id}">Save</button>
          <button class="btn danger" data-action="del-act" data-act="${a.id}">Delete…</button>
        </div>
      </section>`).join('');

    view.innerHTML = `
      <div class="eyebrow">Sync across devices</div>
      ${FIREBASE_CONFIG ? `<section class="card">
        <div class="gc-head"><span class="mname">Google sync</span><span class="mkind" id="syncStatus">${syncLabel()}</span></div>
        ${fb.user ? `
          <div class="note" style="margin-top:8px">Signed in as <b>${esc(fb.user.email || fb.user.displayName || 'your Google account')}</b>. Every log syncs live to your private cloud space — sign in on any device and the same log is there.</div>
          <div class="mactions">
            <button class="btn primary" data-action="sync-now">Sync now</button>
            <button class="btn" data-action="fb-test">Test cloud sync</button>
            <button class="btn danger" data-action="fb-signout">Sign out…</button>
          </div>
          <div class="note" id="syncDiag">Run “Test cloud sync” to verify data is reaching the cloud.</div>`
        : `
          <div class="note" style="margin-top:8px">Sign in once with your Google account — your log syncs automatically on every device you sign in on. No tokens, no setup links.</div>
          <div class="mactions"><button class="btn primary" data-action="fb-signin">Sign in with Google</button></div>`}
      </section>` : `<section class="card">
        <div class="gc-head"><span class="mname">GitHub sync</span><span class="mkind" id="syncStatus">${syncLabel()}</span></div>
        ${syncCfg.get().token ? `
          <div class="mactions">
            <button class="btn primary" data-action="sync-now">Sync now</button>
            <button class="btn" data-action="sync-copylink">Copy setup link</button>
            <button class="btn danger" data-action="sync-off">Disconnect…</button>
          </div>
          <div class="note">Syncs after every log and whenever the app opens. <b>Save your setup link in Notes:</b> opening it on any fresh install or new device reconnects sync and restores the whole log in one tap.</div>`
        : `
          <div class="field" style="margin-top:10px"><label>GitHub token (gist scope only)</label>
            <input id="sync-token" type="password" placeholder="ghp_…" autocomplete="off"></div>
          <div class="mactions"><button class="btn primary" data-action="sync-on">Connect</button></div>
          <div class="note">One-time setup: github.com/settings/tokens → “Generate new token (classic)” → name it, tick ONLY the “gist” box → Generate. Paste the same token here on every device you use. Your log then syncs through a secret Gist on your own GitHub account — no other server involved.</div>`}
      </section>`}
      <div class="eyebrow">Your data</div>
      <section class="card">
        ${Object.keys(orphanGroups()).length ? `<div class="warnbanner" style="margin-bottom:10px"><strong>${Object.values(orphanGroups()).reduce((t, es) => t + es.length, 0)} orphaned entries found</strong> — they exist but aren't attached to an exercise. Tap Repair data; anything left gets a picker below.</div>` : ''}
        ${Object.entries(orphanGroups()).map(([oid, es]) => {
          const d1 = new Date(Math.min(...es.map(e => e.ts))), d2 = new Date(Math.max(...es.map(e => e.ts)));
          const range = d1.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + '–' + d2.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
          const sample = es.slice(0, 4).map(e => fmt(e.amount)).join(', ');
          return `<div class="cal-day" data-orphan="${oid}">
            <div class="cc-row"><span class="ct-strong">${es.length} entries · ${range}</span><span class="gc-frac">e.g. ${esc(sample)}</span></div>
            <div class="mactions"><select data-f="target">${state.activities.map(a => `<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select>
            <button class="btn primary" data-action="orphan-apply" data-oid="${oid}">Attach</button></div>
          </div>`;
        }).join('')}
        <div class="datarow">
          <button class="btn" data-action="repair">Repair data</button>
          <button class="btn" data-action="export">Export backup</button>
          <label class="btn" style="display:inline-flex;align-items:center;cursor:pointer">Import backup
            <input id="importFile" type="file" accept=".json,application/json" style="display:none"></label>
          <button class="btn danger" data-action="reset">Erase everything…</button>
        </div>
        <div class="note">Data is saved on this device two ways (browser storage + a mirror), ${state.entries.length} entries stored. Still worth exporting a JSON backup now and then — it restores everything via Import. · Training Log build ${APP_VERSION}</div>
      </section>
      <div class="eyebrow">Activities & goals</div>
      ${rows}
      <div class="eyebrow">Add an activity</div>
      <section class="card">
        <div class="mgrid">
          <div class="field"><label>Name</label><input id="na-name" placeholder="e.g. Dips"></div>
          <div class="field"><label>Type</label>
            <select id="na-kind">
              <option value="count">Reps (counts add up daily)</option>
              <option value="distance">Distance (adds up daily)</option>
              <option value="duration">Time (adds up daily)</option>
              <option value="measure">Measurement (latest value, e.g. weight)</option>
            </select></div>
          <div class="field"><label>Unit</label><input id="na-unit" placeholder="reps, mi, sec, lb…"></div>
          <div class="field"><label>Daily goal / target (optional)</label><input id="na-goal" type="number" inputmode="decimal" step="any" min="0" placeholder="none"></div>
          <div class="field"><label>Section</label>
            <select id="na-group">${GROUPS.map(g => `<option value="${g}">${GROUP_LABEL[g]}</option>`).join('')}</select></div>
        </div>
        <div class="mactions"><button class="btn primary" data-action="add-act">Add activity</button></div>
      </section>
    `;
  }

  /* ================= actions ================= */
  function startRest(act) {
    if (act.group !== 'calisthenics' && act.group !== 'abs') return;
    const secsLeft = act.plan && act.plan.id === 'armstrong' ? 90 : 60;
    restTimer = { actId: act.id, label: act.name, end: Date.now() + secsLeft * 1000 };
    updateRestPill();
  }
  function updateRestPill() {
    const pill = $('#restpill');
    if (!restTimer) { pill.style.display = 'none'; return; }
    const left = Math.ceil((restTimer.end - Date.now()) / 1000);
    if (left <= 0) {
      restTimer = null;
      pill.style.display = 'none';
      beep();
      toast('Rest over — next set');
      return;
    }
    pill.style.display = 'flex';
    pill.innerHTML = `<span>REST <b>${secs(left)}</b> · ${esc(restTimer.label)}</span><button data-action="rest-skip">Skip</button>`;
  }

  function logAmount(actId, amount, mins) {
    primeAudio();
    const act = actById(actId);
    if (!act || !(amount > 0)) return;
    const entry = { id: uid(), actId, amount, ts: Date.now(), n: act.name };
    if (mins > 0) entry.mins = mins;
    if (loadToggle[actId]) {
      const lo = loadOpt(act);
      if (lo) entry.load = lo.lbs;
    }
    state.entries.push(entry);
    startRest(act);
    save();
    if (act.kind === 'measure') {
      toast('Recorded ' + fmt(amount) + ' ' + act.unit);
    } else if (act.kind === 'distance' && mins > 0) {
      toast('Logged ' + fmt(amount) + ' ' + act.unit + ' at ' + paceStr(act, amount, mins));
    } else if (act.goal != null) {
      const total = dayValue(act, todayKey()) || 0;
      const remain = act.goal - total;
      toast(remain > 0
        ? 'Logged ' + fmt(amount) + ' — ' + fmt(remain) + ' ' + act.unit + ' to go'
        : (total - amount < act.goal ? '🏁 Goal hit: ' + act.name + '!' : 'Logged ' + fmt(amount) + ' — ' + fmt(total) + ' total'));
    } else {
      toast('Logged ' + fmt(amount) + ' ' + act.unit);
    }
    render();
  }

  /* backfill: log to a past date (noon local, ordered after that day's existing entries) */
  function logAmountAt(actId, amount, mins, key) {
    const act = actById(actId);
    if (!act || !(amount > 0)) return;
    const existing = entriesFor(actId, key);
    const base = keyToDate(key).getTime() + 12 * 3600000;
    const ts = existing.length ? Math.max(...existing.map(e => e.ts)) + 60000 : base;
    const entry = { id: uid(), actId, amount, ts: Math.min(ts, Date.now()), n: act.name };
    if (mins > 0) entry.mins = mins;
    state.entries.push(entry);
    state.entries.sort((a, b) => a.ts - b.ts);
    save();
    toast('Added to ' + keyToDate(key).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }));
    render();
  }

  /* ---- per-exercise month calendar with day inspection + backfill ---- */
  function calendarBlock(act) {
    const now = new Date();
    const mOff = state.ui.calMonth || 0;
    const first = new Date(now.getFullYear(), now.getMonth() + mOff, 1);
    const monthLabel = first.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    const startPad = (first.getDay() + 6) % 7;          // Monday-first grid
    const daysInMonth = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
    const tKey = todayKey();
    let cells = '';
    for (let i = 0; i < startPad; i++) cells += `<span class="cal-cell pad"></span>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const key = dayKey(new Date(first.getFullYear(), first.getMonth(), d).getTime());
      const future = key > tKey;
      const v = future ? null : dayValue(act, key);
      const hit = !future && goalHit(act, key) === true;
      const partial = !hit && v != null && v > 0;
      const selected = state.ui.calSel === key;
      cells += `<button class="cal-cell${hit ? ' hit' : ''}${partial ? ' part' : ''}${selected ? ' sel' : ''}${key === tKey ? ' today' : ''}"
        ${future ? 'disabled' : `data-action="pick-day" data-key="${key}"`}>${d}</button>`;
    }
    let dayPanel = '';
    if (state.ui.calSel) {
      const key = state.ui.calSel;
      const es = entriesFor(act.id, key);
      const label = keyToDate(key).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
      dayPanel = `<div class="cal-day">
        <div class="cc-row"><span class="ct-strong">${esc(label)}</span>
          <span class="gc-frac"><b>${fmt(dayValue(act, key))}</b> ${esc(act.unit)}</span></div>
        ${es.length ? `<div class="setrow">` + es.map(e =>
          `<span class="setchip"><b>${fmt(e.amount)}</b>${e.load ? ` <span class="loadtag">+${e.load}lb</span>` : ''} ${timeShort(e.ts)}
            <button data-action="del-entry" data-id="${e.id}" aria-label="Delete entry">✕</button></span>`).join('') + `</div>`
          : `<div class="hint">Nothing logged this day.</div>`}
        <form class="qform" data-action="calform" data-act="${act.id}" data-key="${key}" style="margin-top:10px">
          <input data-f="amt" type="number" inputmode="decimal" step="any" min="0" placeholder="${esc(act.unit)}" aria-label="Amount to add">
          ${act.kind === 'distance' ? `<input data-f="mins" type="number" inputmode="decimal" step="any" min="0" placeholder="min" aria-label="Minutes (optional)">` : ''}
          <button type="submit">Add</button>
        </form>
      </div>`;
    }
    return `<section class="card">
      <div class="chart-title">
        <span class="ct">${esc(monthLabel)}</span>
        <span class="seg"><button data-action="cal-prev">‹</button><button data-action="cal-next" ${mOff >= 0 ? 'disabled' : ''}>›</button></span>
      </div>
      <div class="cal-grid">
        ${['M','T','W','T','F','S','S'].map(w => `<span class="cal-wd">${w}</span>`).join('')}
        ${cells}
      </div>
      ${dayPanel}
    </section>`;
  }

  function deleteEntry(id) {
    const idx = state.entries.findIndex(e => e.id === id);
    if (idx < 0) return;
    undoBuf = state.entries[idx];
    state.entries.splice(idx, 1);
    save();
    toast('Entry deleted', true);
    render();
  }

  async function exportBackup() {
    const stamp = todayKey().replace(/-/g, '');
    const filename = 'training-log-backup-' + stamp + '.json';
    const data = JSON.stringify({ v: state.v, exported: new Date().toISOString(), activities: state.activities, entries: state.entries, tests: state.tests }, null, 2);
    if (window.claude && window.claude.downloads) {
      try { await window.claude.downloads.save({ filename, data }); toast('Backup saved'); return; }
      catch (err) {
        if (err && err.code === 'declined') return;
        if (err && err.code === 'rate_limited') { toast('One save at a time — try again in a moment'); return; }
        /* fall through to anchor download */
      }
    }
    const a = document.createElement('a');
    a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(data);
    a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
  }

  function importBackup(file) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!Array.isArray(d.activities) || !Array.isArray(d.entries)) throw new Error('bad shape');
        state.activities = d.activities;
        state.entries = d.entries;
        state.tests = Array.isArray(d.tests) ? d.tests : [];
        state.v = d.v || 1;
        state.ui = { tab: 'calisthenics', progressAct: null };
        state = migrate(state);
        save(); render();
        toast('Backup restored — ' + d.entries.length + ' entries');
      } catch (e) { toast('That file isn\'t a valid backup'); }
    };
    r.readAsText(file);
  }

  /* two-step arming for destructive buttons */
  function arm(btn, label, fn) {
    if (btn.dataset.armed) { fn(); return; }
    btn.dataset.armed = '1';
    btn.classList.add('armed');
    const orig = btn.textContent;
    btn.textContent = label;
    setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.classList.remove('armed'); btn.textContent = orig; } }, 3500);
  }

  document.addEventListener('click', ev => {
    const tab = ev.target.closest('nav.tabs button');
    if (tab) { state.ui.tab = tab.dataset.tab; save(); render(true); return; }

    const el = ev.target.closest('[data-action]');
    if (!el) return;
    const act = el.dataset.action;

    if (act === 'log') logAmount(el.dataset.act, parseFloat(el.dataset.amt));
    else if (act === 'open-detail') { state.ui.detail = el.dataset.act; state.ui.calSel = null; state.ui.calMonth = 0; save(); render(true); }
    else if (act === 'back') { state.ui.detail = null; save(); render(true); }
    else if (act === 'hold-start') { primeAudio(); holdState = { actId: el.dataset.act, startTs: Date.now() }; render(); }
    else if (act === 'hold-stop') {
      if (holdState) {
        const elapsed = Math.round((Date.now() - holdState.startTs) / 1000);
        const id = holdState.actId;
        holdState = null;
        if (elapsed > 0) logAmount(id, elapsed); else render();
      }
    }
    else if (act === 'hold-cancel') { holdState = null; render(); }
    else if (act === 'rest-skip') { restTimer = null; updateRestPill(); }
    else if (act === 'pick-day') { state.ui.calSel = state.ui.calSel === el.dataset.key ? null : el.dataset.key; save(); render(); }
    else if (act === 'cal-prev') { state.ui.calMonth = (state.ui.calMonth || 0) - 1; state.ui.calSel = null; save(); render(); }
    else if (act === 'cal-next') { state.ui.calMonth = Math.min(0, (state.ui.calMonth || 0) + 1); state.ui.calSel = null; save(); render(); }
    else if (act === 'del-entry') deleteEntry(el.dataset.id);
    else if (act === 'undo') {
      if (undoBuf) { state.entries.push(undoBuf); state.entries.sort((a,b) => a.ts - b.ts); undoBuf = null; save(); render(); }
      $('#toast').style.display = 'none';
    }
    else if (act === 'pick-act') { state.ui.progressAct = el.dataset.act; save(); render(); }
    else if (act === 'set-range') { state.ui.range = el.dataset.range; save(); render(); }
    else if (act === 'toggle-load') { loadToggle[el.dataset.act] = !loadToggle[el.dataset.act]; render(); }
    else if (act === 'pick-std') { state.ui.stdSel = el.dataset.key; save(); render(); }
    else if (act === 'del-test') {
      state.tests = state.tests.filter(t => t.id !== el.dataset.id);
      save(); toast('Test result deleted'); render();
    }
    else if (act === 'save-act') {
      const row = el.closest('[data-actrow]');
      const a = actById(el.dataset.act);
      if (!a || !row) return;
      const g = row.querySelector('[data-f="goal"]').value.trim();
      const name = row.querySelector('[data-f="name"]').value.trim();
      if (name) a.name = name;
      a.unit = row.querySelector('[data-f="unit"]').value.trim() || a.unit;
      a.goal = g === '' ? null : Math.max(0, parseFloat(g)) || null;
      a.quick = row.querySelector('[data-f="quick"]').value.split(',').map(s => parseFloat(s.trim())).filter(n => n > 0).slice(0, 6);
      a.group = row.querySelector('[data-f="group"]').value;
      const wsInp = row.querySelector('[data-f="ws"]');
      if (wsInp && a.plan) {
        const ws = parseInt(wsInp.value, 10);
        if (ws > 0) a.plan.ws = ws;
      }
      save(); toast('Saved ' + a.name); render();
    }
    else if (act === 'del-act') {
      arm(el, 'Really delete?', () => {
        const a = actById(el.dataset.act);
        state.activities = state.activities.filter(x => x.id !== el.dataset.act);
        state.entries = state.entries.filter(e => e.actId !== el.dataset.act);
        if (state.ui.progressAct === el.dataset.act) state.ui.progressAct = null;
        save(); toast('Deleted ' + (a ? a.name : 'activity')); render();
      });
    }
    else if (act === 'add-act') {
      const name = $('#na-name').value.trim();
      if (!name) { toast('Give it a name first'); return; }
      const kind = $('#na-kind').value;
      const unit = $('#na-unit').value.trim() || (kind === 'count' ? 'reps' : kind === 'distance' ? 'mi' : kind === 'duration' ? 'min' : 'lb');
      const g = $('#na-goal').value.trim();
      const group = kind === 'measure' ? 'health' : ($('#na-group').value || 'calisthenics');
      state.activities.push({ id: uid(), name, kind, unit, goal: g === '' ? null : Math.max(0, parseFloat(g)) || null, quick: [], group, created: Date.now() });
      save(); toast('Added ' + name); render();
    }
    else if (act === 'sync-on') {
      const inp = $('#sync-token');
      const token = inp && inp.value.trim();
      if (!token) { toast('Paste your GitHub token first'); return; }
      syncCfg.set({ token });
      syncStatus = { state: 'idle', last: 0, lastPull: 0, error: null };
      syncErrorToasted = false;
      toast('Connected — syncing…');
      pullSync(true).then(() => pushSync()).then(() => {
        if (syncStatus.state === 'ok') toast('✓ Sync active — ' + state.entries.length + ' entries in the cloud');
        render();
      });
    }
    else if (act === 'sync-now') { pullSync(true).then(() => pushSync()); }
    else if (act === 'fb-signin') { primeAudio(); fbSignIn(); }
    else if (act === 'fb-test') { fbTest(); }
    else if (act === 'fb-signout') {
      arm(el, 'Really sign out?', () => { fbSignOut(); toast('Signed out — data stays on this device'); });
    }
    else if (act === 'sync-copylink') {
      const link = location.origin + location.pathname + '#st=' + (syncCfg.get().token || '');
      (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject()).then(
        () => toast('Setup link copied — save it in Notes'),
        () => { prompt('Copy this setup link:', link); }
      );
    }
    else if (act === 'sync-off') {
      arm(el, 'Really disconnect?', () => {
        syncCfg.set({});
        syncStatus = { state: 'off', last: 0, lastPull: 0, error: null };
        toast('Sync disconnected — data stays on this device');
        render();
      });
    }
    else if (act === 'repair') repairData();
    else if (act === 'orphan-apply') {
      const box = el.closest('[data-orphan]');
      const target = box && box.querySelector('[data-f="target"]').value;
      if (target) {
        const oid = el.dataset.oid;
        state.entries.forEach(e => { if (e.actId === oid) e.actId = target; });
        save(); toast('Entries attached'); render();
      }
    }
    else if (act === 'export') exportBackup();
    else if (act === 'reset') {
      arm(el, 'Tap again to erase ALL data', () => {
        state = defaultState(); save(); render(); toast('Fresh start — everything erased');
      });
    }
  });

  document.addEventListener('submit', ev => {
    const tf = ev.target.closest('form[data-action="testform"]');
    if (tf) {
      ev.preventDefault();
      const std = STANDARDS.find(s => s.key === tf.dataset.key);
      const inp = tf.querySelector('input');
      const v = parseTestValue(std, inp.value);
      if (v == null) { inp.value = ''; inp.focus(); return; }
      state.tests.push({ id: uid(), ts: Date.now(), key: std.key, value: v });
      save();
      const met = std.dir === 'up' ? v >= std.target : v <= std.target;
      toast(met ? '🏁 Standard met: ' + std.name + '!' : 'Recorded ' + stdFmt(std, v) + ' — goal ' + stdFmt(std, std.target));
      render();
      return;
    }
    const cf = ev.target.closest('form[data-action="calform"]');
    if (cf) {
      ev.preventDefault();
      const amt = parseFloat(cf.querySelector('[data-f="amt"]').value);
      const minsInp = cf.querySelector('[data-f="mins"]');
      const mins = minsInp ? parseFloat(minsInp.value) : NaN;
      if (amt > 0) logAmountAt(cf.dataset.act, amt, mins > 0 ? mins : undefined, cf.dataset.key);
      return;
    }
    const f = ev.target.closest('form[data-action="logform"]');
    if (!f) return;
    ev.preventDefault();
    const distInp = f.querySelector('[data-f="dist"]');
    if (distInp) {
      const v = parseFloat(distInp.value);
      const m = parseFloat(f.querySelector('[data-f="mins"]').value);
      if (v > 0) { logAmount(f.dataset.act, v, m > 0 ? m : undefined); }
      else { distInp.value = ''; distInp.focus(); }
      return;
    }
    const inp = f.querySelector('input');
    const v = parseFloat(inp.value);
    if (v > 0) { logAmount(f.dataset.act, v); }
    else { inp.value = ''; inp.focus(); }
  });

  document.addEventListener('change', ev => {
    if (ev.target.id === 'importFile' && ev.target.files && ev.target.files[0]) {
      importBackup(ev.target.files[0]);
      ev.target.value = '';
    }
  });

  /* ---- chart tooltips ---- */
  const tip = $('#tip');
  function moveTip(ev) {
    const pad = 12;
    let x = ev.clientX + pad, y = ev.clientY - 34;
    const r = tip.getBoundingClientRect();
    if (x + r.width > window.innerWidth - 6) x = ev.clientX - r.width - pad;
    if (y < 6) y = ev.clientY + pad;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  }
  document.addEventListener('pointerover', ev => {
    const t = ev.target.closest && ev.target.closest('[data-tip]');
    if (t) { tip.textContent = t.dataset.tip; tip.style.display = 'block'; moveTip(ev); }
  });
  document.addEventListener('pointermove', ev => {
    if (tip.style.display === 'block') {
      const t = ev.target.closest && ev.target.closest('[data-tip]');
      if (t) { tip.textContent = t.dataset.tip; moveTip(ev); } else tip.style.display = 'none';
    }
  });
  document.addEventListener('pointerout', ev => {
    if (!(ev.relatedTarget && ev.relatedTarget.closest && ev.relatedTarget.closest('[data-tip]'))) tip.style.display = 'none';
  });

  /* re-render when the day rolls over or tab becomes visible again */
  let lastDay = todayKey();
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { flushPush(); return; }   // going background: force-push anything pending
    if (todayKey() !== lastDay) { lastDay = todayKey(); render(); }
    if ((syncCfg.get().token || cloudActive()) && Date.now() - syncStatus.lastPull > 60000) pullSync(false);
  });
  window.addEventListener('pagehide', flushPush);
  setInterval(() => { if (todayKey() !== lastDay) { lastDay = todayKey(); render(); } }, 60000);

  /* timer tick: hold-elapsed display + rest countdown */
  setInterval(() => {
    if (holdState) {
      const el = document.getElementById('holdElapsed');
      if (el) el.textContent = secs(Math.round((Date.now() - holdState.startTs) / 1000));
    }
    if (restTimer) updateRestPill();
  }, 250);

  /* mouse users: vertical wheel scrolls the tab bar sideways */
  $('#tabbar').addEventListener('wheel', ev => {
    if (Math.abs(ev.deltaY) > Math.abs(ev.deltaX)) {
      ev.preventDefault();
      ev.currentTarget.scrollLeft += ev.deltaY;
    }
  }, { passive: false });

  /* setup link: opening the app with #st=<token> connects sync instantly (fresh installs, new devices) */
  const hashMatch = location.hash.match(/^#st=([A-Za-z0-9_]+)$/);
  if (hashMatch) {
    syncCfg.set({ token: hashMatch[1] });
    syncStatus = { state: 'idle', last: 0, lastPull: 0, error: null };
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    toast('Sync connected from setup link — restoring…');
  }

  /* offline support: install the service worker (github.io only — no-op elsewhere) */
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }

  armstrongAutoProgress();
  initFirebase();
  render();
  pullSync(true);
})();
</script>
